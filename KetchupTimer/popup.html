<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ketchup Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
  <style>
    body { width: 350px; } /* グラフ表示のために少し幅を広げる */
    .view { display: none; width: 100%; }
    .view.active { display: flex; flex-direction: column; align-items: center; }
    .chart-container { width: 100%; height: 200px; margin-top: 10px; }
    .tabs { display: flex; gap: 5px; margin-bottom: 10px; width: 100%; justify-content: center; }
    .tab-btn { padding: 4px 8px; font-size: 12px; border: 1px solid #ccc; background: #f0f0f0; color: #333; }
    .tab-btn.active { background: #ff4d4d; color: white; border-color: #ff4d4d; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main Timer View -->
    <div id="mainView" class="view active">
      <div class="header">
        <h1>Ketchup Timer</h1>
      </div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="phase-display" id="phaseDisplay">Focus</div>
      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
      
      <div class="settings">
        <label>
          Focus (min):
          <input type="number" id="focusTime" value="25" min="1" max="60">
        </label>
        <label>
          Break (min):
          <input type="number" id="breakTime" value="5" min="1" max="60">
        </label>
        <label>
          Long Break (min):
          <input type="number" id="longBreakTime" value="15" min="1" max="60">
        </label>
        <label>
          Cycles before Long Break:
          <input type="number" id="cycles" value="4" min="1" max="10">
        </label>
      </div>
      <div class="footer" style="margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 10px; width: 100%;">
        <a href="#" id="viewStats">View Statistics</a>
      </div>
    </div>

    <!-- Statistics View -->
    <div id="statsView" class="view">
      <div class="header">
        <h1>Statistics</h1>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-period="daily">Daily</button>
        <button class="tab-btn" data-period="weekly">Weekly</button>
        <button class="tab-btn" data-period="monthly">Monthly</button>
      </div>
      <div class="chart-container">
        <canvas id="statsChart"></canvas>
      </div>
      <div style="margin-top: 20px; text-align: center; width: 100%;">
        <button id="backToTimer" style="background: #666; width: 100%;">Back to Timer</button>
      </div>
    </div>
  </div>
  <script src="js/popup.js"></script>
</body>
</html>
